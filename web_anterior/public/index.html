<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1220">
  <title>HoudiniApp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
  <script src="vendor/sql-wasm-browser.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <div class="barra-superior">
    <span class="marca">HOUDINI <b>APP</b></span>
    <button data-ir="complices" data-ico="red" aria-label="Cómplices"></button>
    <button data-ir="ajustes" data-ico="ajustes" aria-label="Configuración"></button>
  </div>
  <main id="vista"><p class="vacio">Cargando…</p></main>
  <nav aria-label="Principal">
    <button data-ir="inicio" data-ico="inicio"><span>Inicio</span></button>
    <button data-ir="perfiles" data-ico="perfil"><span>Perfiles</span></button>
    <button data-ir="reglas" data-ico="regla"><span>Reglas</span></button>
    <button data-ir="historial" data-ico="grafica"><span>Historial</span></button>
    <button data-ir="tienda" data-ico="tienda"><span>Tienda</span></button>
  </nav>
  <div id="aviso" role="status" hidden></div>
</body>
</html>
